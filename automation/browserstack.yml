# BrowserStack Automate config. Credentials come from the environment
# (BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY), never stored here.
userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: BrewCart Webinar
buildName: brewcart-checkout

platforms:
  - os: Windows
    osVersion: 11
    browserName: chrome
    browserVersion: latest

parallelsPerPlatform: 1

# The site is public on GitHub Pages, so no tunnel is needed.
browserstackLocal: false

# AI self-healing: recovers from changed locators at runtime.
selfHeal: true

framework: playwright
testObservability: true
